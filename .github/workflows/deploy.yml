name: Deploy to GitHub Pages

# Tests run on every push. The site is deployed from the repository's default
# branch only (whatever it is named), which is also what Pages allows.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel one that is in progress.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # Optional repository variables (Settings → Secrets and variables → Actions → Variables):
          #   VITE_ENCRYPTED_API_KEY  passphrase-encrypted aisstream key (create it in the app)
          #   VITE_RELAY_URL          wss:// URL of a VesselViewer relay
          VITE_ENCRYPTED_API_KEY: ${{ vars.VITE_ENCRYPTED_API_KEY }}
          VITE_RELAY_URL: ${{ vars.VITE_RELAY_URL }}
      - if: github.ref_name == github.event.repository.default_branch
        uses: actions/configure-pages@v6
      - if: github.ref_name == github.event.repository.default_branch
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.ref_name == github.event.repository.default_branch
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
