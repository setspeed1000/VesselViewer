<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Live AIS ship tracking on a world map, with true-scale 3D ship models." />
    <meta name="color-scheme" content="light" />
    <title>VesselViewer</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b3d5c'/%3E%3Cpath d='M32 8 52 54 32 43 12 54Z' fill='%23fff'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="app">
      <!-- Replaced by the app on start. Visible only if the JavaScript bundle did not load. -->
      <div class="vv-fatal" style="font: 15px system-ui, sans-serif; max-width: 560px; margin: 15vh auto; padding: 0 16px; color: #14202b">
        <h1 style="font-size: 20px">Loading VesselViewer…</h1>
        <p>
          If this message stays, the site was published without being built. In the repository go to
          Settings → Pages and set Source to <strong>GitHub Actions</strong>, then run the
          "Deploy to GitHub Pages" workflow.
        </p>
      </div>
    </div>
    <noscript>VesselViewer needs JavaScript and WebGL2.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
